<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bingo Number Caller</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header class="header">
      <h1>Bingo Caller</h1>
      <p class="remaining">Numbers remaining: <span id="remaining">90</span></p>
    </header>

    <section class="display-card">
      <p class="display-label">Current Number</p>
      <div id="current-number" class="current-number" aria-live="polite">&mdash;</div>
      <p id="status" class="status" role="status"></p>
    </section>

    <div id="board-backdrop" class="backdrop"></div>

    <section id="board-panel" class="board-wrap" aria-label="Number board">
      <div class="board-header">
        <h2>Number Board</h2>
        <button id="board-close" class="btn-close" aria-label="Close number board">&times;</button>
      </div>
      <div id="board" class="board"></div>
    </section>

    <button id="board-fab" class="fab" aria-expanded="false" aria-label="Toggle number board">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <circle cx="5" cy="5" r="2.1" />
        <circle cx="12" cy="5" r="2.1" />
        <circle cx="19" cy="5" r="2.1" />
        <circle cx="5" cy="12" r="2.1" />
        <circle cx="12" cy="12" r="2.1" />
        <circle cx="19" cy="12" r="2.1" />
        <circle cx="5" cy="19" r="2.1" />
        <circle cx="12" cy="19" r="2.1" />
        <circle cx="19" cy="19" r="2.1" />
      </svg>
    </button>

    <section class="history-wrap history-left" aria-label="Draw history">
      <h2>Draw History</h2>
      <div id="history-left" class="history"></div>
    </section>

    <section class="history-wrap history-right" aria-label="Draw history">
      <h2>Draw History</h2>
      <div id="history-right" class="history"></div>
    </section>

    <div class="controls">
      <button id="next-btn" class="btn btn-primary">Generate</button>
      <button id="reset-btn" class="btn btn-secondary">Reset</button>
    </div>

    <p class="hint">Space = generate &middot; R = reset &middot; or tap the ball</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
